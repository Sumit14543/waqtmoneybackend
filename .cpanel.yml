---
deployment:
  tasks:
    - export DEPLOYPATH=/home/waqtmoney/public_html
    - /bin/mkdir -p $DEPLOYPATH/backend $DEPLOYPATH/backend/uploads
    # 1. Deploy backend (protecting uploads folder and uploaded documents)
    - /bin/rsync -avz --exclude="node_modules" --exclude=".env" --exclude="uploads" --exclude="uploads/**" Server/ $DEPLOYPATH/backend/
    # 2. Deploy frontend (fail-safe check for dist folder - ZERO DELETE, protecting crm, backend, uploads, and .env)
    - if [ -d "frontend/dist" ]; then /bin/rsync -avz --exclude="backend" --exclude="backend/**" --exclude="crm" --exclude="crm/**" --exclude="uploads" --exclude="uploads/**" --exclude=".env" frontend/dist/ $DEPLOYPATH/; else echo "Warning: frontend/dist not found. Please build frontend locally before pushing."; fi

